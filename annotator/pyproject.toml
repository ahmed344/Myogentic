[project]
name = "myogentic-annotator"
version = "0.1.0"
description = "Offline whole-slide morphology annotation workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "openslide-python>=1.4,<2",
  "openslide-bin>=4,<5",
  "pillow>=11,<13",
  "pyvips[binary]>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
